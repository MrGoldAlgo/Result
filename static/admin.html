<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Setup</title>
<style>body{font-family:system-ui;background:#080b10;color:#edf2f7;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.card{background:#10161f;border:1px solid #263141;border-radius:14px;padding:18px;margin-bottom:14px}input,button{font:inherit;background:#0b1017;border:1px solid #2b3748;color:#fff;padding:10px;border-radius:8px}input{width:100%;box-sizing:border-box;margin:6px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{cursor:pointer;background:#e4b64b;color:#151008;font-weight:800}.key{word-break:break-all;background:#080c12;padding:12px;border-radius:8px;color:#e4b64b}.muted{color:#96a1b0;font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #263141;padding:9px;font-size:13px}a{color:#e4b64b}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><h1>Mr Gold Free Edition — Admin Setup</h1>
<div class="card"><label class="muted">ADMIN_TOKEN from your server environment</label><input id="token" type="password" placeholder="change-me-now"><button onclick="loadAccounts()">Load accounts</button></div>
<div class="card"><h3>Create tracked MT5 account</h3><div class="grid"><div><label class="muted">Display name</label><input id="name" placeholder="Mr Gold Algo - Vantage Live"></div><div><label class="muted">Public slug</label><input id="slug" placeholder="mr-gold-main"></div></div><button onclick="createAcc()">Create account + API key</button><div id="result"></div></div>
<div class="card"><h3>Accounts</h3><div id="accounts" class="muted">Enter admin token and load accounts.</div></div></div>
<script>
const $=s=>document.querySelector(s);const hdr=()=>({'Content-Type':'application/json','X-Admin-Token':$('#token').value});
async function loadAccounts(){let r=await fetch('/api/v1/admin/accounts',{headers:hdr()}); if(!r.ok){$('#accounts').textContent='Access denied or server error.';return}let a=await r.json();$('#accounts').innerHTML='<table><tr><th>Name</th><th>Broker</th><th>Login</th><th>Public page</th></tr>'+a.map(x=>`<tr><td>${x.name}</td><td>${x.broker||'-'}</td><td>${x.login||'-'}</td><td><a target="_blank" href="/p/${x.public_slug}">/p/${x.public_slug}</a></td></tr>`).join('')+'</table>'}
async function createAcc(){let r=await fetch('/api/v1/admin/accounts',{method:'POST',headers:hdr(),body:JSON.stringify({name:$('#name').value,public_slug:$('#slug').value})});let x=await r.json();if(!r.ok){$('#result').innerHTML='<p class="muted">'+(x.detail||'Error')+'</p>';return}$('#result').innerHTML=`<p class="muted">Copy this API key now. It is intentionally only returned once.</p><div class="key">${x.api_key}</div><p><a target="_blank" href="${x.public_url}">Open public page</a></p>`;loadAccounts()}
</script></body></html>
